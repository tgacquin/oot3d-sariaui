name: Bug report
description: Report a bug or crash with SariaUI.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not attach game files, keys, or saves. Review logs for personal information before sharing."
  - type: input
    id: version
    attributes:
      label: SariaUI release version
      placeholder: Release version or commit if you built SariaUI yourself
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 10/11 x64
        - macOS
        - Desktop Linux
        - Steam Deck Desktop Mode
        - Steam Deck Gaming Mode
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, what happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Hardware, settings, and logs
      description: Include relevant graphics hardware, changed settings, and reviewed log excerpts.
  - type: textarea
    id: randomizer
    attributes:
      label: Randomizer report (if applicable)
      description: |
        Were you playing solo, hosting, or joining? For multiplayer issues, tell us what each player saw.
        Open `user/config/oot3d-randomizer/` beside SariaUI and attach the matching report.

        - If it failed during **Randomizing**, copy `last-generation.json` before trying another seed.
        - If it happened during gameplay, copy `last-played.json` before opening another randomized file. Include the area and what you were doing.

        If GitHub declines the JSON attachment, zip it and attach the ZIP here.
