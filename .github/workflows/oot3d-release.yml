name: SariaUI desktop release candidates
run-name: SariaUI probe — windows-x64
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        required: true
        options: [windows-x64]
permissions:
  actions: read
  contents: read
jobs:
  replay:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-startup-reproduction
          path: build-release-windows-x64/bundle
          run-id: 45077772257
          github-token: ${{ github.token }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-gdb
      - name: Inspect Windows startup
        shell: 'msys2 {0}'
        run: python3 tools/oot3d/release/diagnose_windows_startup.py
