name: SariaUI desktop release candidates
run-name: SariaUI probe — windows-x64
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        required: true
        options: [windows-x64]
permissions:
  actions: read
  contents: read
jobs:
  replay:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-startup-reproduction
          path: build-release-windows-x64/bundle
          run-id: 45077772257
          github-token: ${{ github.token }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-SDL2
      - name: Verify SDL runtime deployment on captured Windows package
        shell: 'msys2 {0}'
        run: |
          set -euo pipefail
          cp -r build-release-windows-x64 resolved-package
          source_bundle="$(cygpath -m "$PWD/build-release-windows-x64/bundle")"
          out="$(cygpath -m "$PWD/resolved-package")"
          runtime="$(cygpath -m "$MINGW_PREFIX/bin")"
          cmake -DBUNDLE_TARGET_EXECUTE=1 -DBINARY_PATH="$out" \
            -DEXECUTABLE_PATH="$source_bundle/SariaUI.exe" \
            -DBUNDLE_LIBRARY_PATHS="$source_bundle;$runtime" \
            -P CMakeModules/BundleTarget.cmake
          test -f resolved-package/bundle/SDL3.dll
          python3 tools/oot3d/release/package.py windows-x64 resolved-package artifacts 1.0.0
